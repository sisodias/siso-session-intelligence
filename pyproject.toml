[project]
name = "siso-session-intelligence"
version = "0.1.0"
description = "Privacy-reduced, evidence-backed learning from agent sessions"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
siso-session-intelligence = "siso_session_intelligence.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
